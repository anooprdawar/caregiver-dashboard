[project]
name = "caregiver-dashboard"
version = "0.1.0"
description = "Local-first, MyChart-synced single source of truth for a caregiver managing a complex diagnosis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pydicom>=2.4",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
caregiver = "caregiver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caregiver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
